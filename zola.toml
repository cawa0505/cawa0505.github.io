base_url = "https://cawa0505.github.io"
theme = "terminimal"
title = "Jimmy Yen"
description = "Building sicker tools than yesterday. Technical articles, open-source high-performance tools."
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = true

taxonomies = [{ name = "tags", feed = true }]

[markdown.highlighting]
theme = "dracula"

[extra]
accent_color = "purple"
background_color = "dark"
logo_text = "Jimmy Yen"
author = "Jimmy Yen"
use_full_hack_font = true
menu_items = [
    { name = "blog", url = "$BASE_URL" },
    { name = "tags", url = "$BASE_URL/tags" },
    { name = "archive", url = "$BASE_URL/archive" },
    { name = "github", url = "https://github.com/cawa0505", newtab = true },
]
